{% extends "base.html" %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}" />
{% endblock %}

{% block title %}Connexion{% endblock %}

{% block bodyId %}LoginPage{% endblock %}

{% block content %}
<form action="" method="post">
    {% csrf_token %}
    
    {% if error %}
        <p class="error">{{ error }}</p>
    {% else %}
        <p class="title">Entrez le nom d'utilisateur et le mot de passe</p>
    {% endif %}
    
    <p class="normal">
        <label for="username">Utilisateur : </label>
        <input name="username" id="username" size="32" type="text" value="">
    </p>
    
    <p class="normal">
        <label for="password">Mot de passe : </label>
        <input name="password" id="password" size="30" type="password" value="">
    </p>
    
    <p>
        <input type="submit" value="Connexion">
    </p>
</form>
{% endblock %}
